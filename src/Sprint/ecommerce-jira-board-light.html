<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopLearn — Java Full Stack Board</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #f5f6fa;
    --surface3: #e8eaf2;
    --border: #d0d4e8;
    --accent: #5b52e0;
    --accent2: #e84060;
    --accent3: #1db85a;
    --accent4: #e08010;
    --text: #1a1a2e;
    --text2: #4a4a6a;
    --text3: #8888aa;
    --todo: #5b52e0;
    --inprog: #e08010;
    --done: #1db85a;
    --review: #e84060;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GRID BG */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image: linear-gradient(rgba(91,82,224,0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(91,82,224,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none; z-index:0;
  }

  .wrapper { position:relative; z-index:1; }

  /* HEADER */
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(240,242,248,0.95);
    backdrop-filter: blur(12px);
    position: sticky; top:0; z-index:100;
  }
  .logo {
    display:flex; align-items:center; gap:12px;
  }
  .logo-icon {
    width:36px; height:36px; background: var(--accent);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .logo-text { font-size:18px; font-weight:800; letter-spacing:-0.5px; }
  .logo-text span { color: var(--accent); }
  .project-meta { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text3); }

  .header-right { display:flex; align-items:center; gap:16px; }
  .sprint-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:20px;
    padding: 6px 14px;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    color: var(--accent);
  }
  .progress-wrap { display:flex; align-items:center; gap:10px; }
  .progress-label { font-size:12px; color:var(--text2); font-family:'JetBrains Mono',monospace; }
  .progress-bar {
    width:120px; height:6px;
    background: var(--surface3);
    border-radius:3px; overflow:hidden;
  }
  .progress-fill {
    height:100%; background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius:3px;
    transition: width 0.6s ease;
  }

  /* PHASE TABS */
  .phase-nav {
    padding: 20px 32px 0;
    display:flex; gap:4px; border-bottom:1px solid var(--border);
  }
  .phase-tab {
    padding:10px 20px;
    font-size:13px; font-weight:600;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--text3);
    transition: all 0.2s;
    position:relative;
  }
  .phase-tab:hover { color: var(--text2); background: var(--surface2); }
  .phase-tab.active {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border);
    border-bottom-color: var(--surface);
  }
  .phase-tab .tab-dot {
    display:inline-block; width:7px; height:7px;
    border-radius:50%; margin-right:7px;
  }
  .phase-tab.locked { opacity:0.4; cursor:not-allowed; }
  .phase-tab.locked::after {
    content:'🔒'; font-size:10px; margin-left:6px;
  }

  /* BOARD */
  .board-area {
    padding: 28px 32px;
  }
  .phase-header {
    margin-bottom: 24px;
  }
  .phase-title {
    font-size:26px; font-weight:800; letter-spacing:-1px;
    margin-bottom:6px;
  }
  .phase-title span { color: var(--accent); }
  .phase-desc {
    font-size:14px; color:var(--text2);
    max-width:600px; line-height:1.6;
  }
  .phase-tags { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .tag {
    font-size:11px; font-family:'JetBrains Mono',monospace;
    padding:3px 10px; border-radius:4px;
    background: var(--surface2); border:1px solid var(--border);
    color: var(--text2);
  }

  /* KANBAN COLUMNS */
  .kanban {
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:16px;
    min-height:500px;
  }
  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius:12px;
    padding:16px;
    min-height:400px;
  }
  .col-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding-bottom:12px;
    border-bottom:1px solid var(--border);
  }
  .col-title-wrap { display:flex; align-items:center; gap:8px; }
  .col-dot { width:10px; height:10px; border-radius:50%; }
  .col-title { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .col-count {
    font-size:11px; font-family:'JetBrains Mono',monospace;
    background:var(--surface2); border:1px solid var(--border);
    padding:2px 8px; border-radius:10px; color:var(--text3);
  }

  /* TICKET CARD */
  .ticket {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius:8px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    transition: all 0.2s;
    position:relative;
    overflow:hidden;
  }
  .ticket::before {
    content:'';
    position:absolute; left:0; top:0; bottom:0;
    width:3px;
    border-radius:3px 0 0 3px;
  }
  .ticket.phase1::before { background: var(--accent); }
  .ticket.phase2::before { background: var(--accent4); }
  .ticket:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(91,82,224,0.12);
  }
  .ticket-id {
    font-size:10px; font-family:'JetBrains Mono',monospace;
    color: var(--text3); margin-bottom:6px;
  }
  .ticket-title {
    font-size:13px; font-weight:600; line-height:1.4;
    margin-bottom:10px; color:var(--text);
  }
  .ticket-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .ticket-tag {
    font-size:10px; font-family:'JetBrains Mono',monospace;
    padding:2px 7px; border-radius:3px;
    background: var(--surface3);
    color: var(--text2);
  }
  .ticket-tag.java { background:rgba(91,82,224,0.1); color:var(--accent); border:1px solid rgba(91,82,224,0.25); }
  .ticket-tag.design { background:rgba(224,128,16,0.1); color:var(--accent4); border:1px solid rgba(224,128,16,0.25); }
  .ticket-tag.spring { background:rgba(29,184,90,0.1); color:var(--accent3); border:1px solid rgba(29,184,90,0.25); }
  .ticket-tag.db { background:rgba(232,64,96,0.1); color:var(--accent2); border:1px solid rgba(232,64,96,0.25); }

  .ticket-footer {
    display:flex; align-items:center; justify-content:space-between;
  }
  .ticket-priority {
    font-size:10px; font-family:'JetBrains Mono',monospace;
    display:flex; align-items:center; gap:4px;
  }
  .priority-dot { width:6px; height:6px; border-radius:50%; }
  .priority-high .priority-dot { background:var(--accent2); }
  .priority-med .priority-dot { background:var(--accent4); }
  .priority-low .priority-dot { background:var(--text3); }
  .priority-high .priority-text { color:var(--accent2); }
  .priority-med .priority-text { color:var(--accent4); }
  .priority-low .priority-text { color:var(--text3); }

  .ticket-est {
    font-size:10px; font-family:'JetBrains Mono',monospace;
    color:var(--text3);
    background:var(--surface3);
    padding:2px 7px; border-radius:3px;
  }

  /* STATUS TOGGLE */
  .status-btn {
    margin-top:10px;
    width:100%;
    padding:6px;
    font-size:11px; font-weight:600;
    font-family:'Syne',sans-serif;
    border:1px solid var(--border);
    border-radius:5px;
    background:transparent;
    color:var(--text3);
    cursor:pointer;
    transition:all 0.2s;
  }
  .status-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* MODAL */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(100,100,140,0.5); backdrop-filter:blur(6px);
    z-index:1000; align-items:center; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    width:560px; max-width:95vw; max-height:85vh;
    overflow-y:auto;
    padding:28px;
    position:relative;
  }
  .modal-close {
    position:absolute; top:16px; right:16px;
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text2); width:30px; height:30px;
    border-radius:6px; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-id { font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--text3); margin-bottom:8px; }
  .modal-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; margin-bottom:16px; }
  .modal-section { margin-bottom:20px; }
  .modal-section-title {
    font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text3); margin-bottom:10px; padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .modal-desc { font-size:14px; color:var(--text2); line-height:1.7; }
  .concept-list { list-style:none; }
  .concept-list li {
    font-size:13px; color:var(--text2); padding:6px 0;
    border-bottom:1px solid var(--border);
    display:flex; align-items:flex-start; gap:8px;
    line-height:1.5;
  }
  .concept-list li::before { content:'▸'; color:var(--accent); font-size:10px; margin-top:3px; flex-shrink:0; }
  .code-hint {
    background:var(--surface3); border:1px solid var(--border);
    border-radius:8px; padding:14px;
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--accent3); line-height:1.6;
    white-space:pre-wrap;
  }
  .modal-status-row {
    display:flex; gap:8px; margin-top:16px;
  }
  .modal-status-btn {
    flex:1; padding:8px;
    font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
    border-radius:6px; cursor:pointer; border:1px solid var(--border);
    background:var(--surface2); color:var(--text2);
    transition:all 0.2s;
  }
  .modal-status-btn:hover { opacity:0.8; }
  .modal-status-btn.todo { background:rgba(91,82,224,0.1); color:var(--todo); border-color:var(--todo); }
  .modal-status-btn.inprog { background:rgba(224,128,16,0.1); color:var(--inprog); border-color:var(--inprog); }
  .modal-status-btn.review { background:rgba(232,64,96,0.1); color:var(--review); border-color:var(--review); }
  .modal-status-btn.done { background:rgba(29,184,90,0.1); color:var(--done); border-color:var(--done); }

  /* PHASE LOCKED */
  .locked-overlay {
    display:none;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:60px 40px;
    text-align:center;
  }
  .locked-overlay.show { display:block; }
  .locked-icon { font-size:48px; margin-bottom:16px; }
  .locked-title { font-size:20px; font-weight:800; margin-bottom:8px; }
  .locked-desc { font-size:14px; color:var(--text2); }

  /* STATS BAR */
  .stats-bar {
    display:flex; gap:20px; padding:16px 32px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-wrap:wrap;
  }
  .stat {
    display:flex; align-items:center; gap:8px;
  }
  .stat-num {
    font-size:20px; font-weight:800;
    font-family:'JetBrains Mono',monospace;
  }
  .stat-label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; }
  .stat-divider { width:1px; background:var(--border); }

  /* SPRINT BAR */
  .sprint-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 18px;
    margin-bottom: 20px;
  }
  .sprint-bar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sprint-bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sprint-status-badge {
    font-size: 12px; font-weight: 700; padding: 4px 12px;
    border-radius: 20px; font-family: 'JetBrains Mono', monospace;
  }
  .sprint-status-badge.not-started { background: var(--surface3); color: var(--text3); }
  .sprint-status-badge.active { background: rgba(224,128,16,0.12); color: var(--inprog); border: 1px solid var(--inprog); }
  .sprint-status-badge.completed { background: rgba(29,184,90,0.12); color: var(--done); border: 1px solid var(--done); }
  .sprint-date-display { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
  .sprint-label { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
  .sprint-date-input {
    font-size: 12px; font-family: 'JetBrains Mono', monospace;
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); cursor: pointer; outline: none;
  }
  .sprint-date-input:focus { border-color: var(--accent); }
  .sprint-btn {
    font-size: 12px; font-weight: 700; font-family: 'Syne', sans-serif;
    padding: 6px 16px; border-radius: 6px; cursor: pointer;
    border: none; transition: all 0.2s;
  }
  .start-btn { background: var(--accent); color: #fff; }
  .start-btn:hover { opacity: 0.85; }
  .complete-btn { background: var(--done); color: #fff; }
  .complete-btn:hover { opacity: 0.85; }
  .reopen-btn { background: var(--surface3); color: var(--text2); border: 1px solid var(--border); }
  .reopen-btn:hover { background: var(--border); }

  @media(max-width:900px) {
    .kanban { grid-template-columns:1fr 1fr; }
    header { padding:16px; }
    .board-area { padding:16px; }
    .phase-nav { padding:12px 16px 0; overflow-x:auto; }
  }
  @media(max-width:600px) {
    .kanban { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrapper">

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">🛒</div>
    <div>
      <div class="logo-text">Shop<span>Learn</span></div>
      <div class="project-meta">PROJ-EC · Java Full Stack</div>
    </div>
  </div>
  <div class="header-right">
    <div class="sprint-badge">Sprint 1 — Phase 1</div>
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">0%</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
</header>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" style="color:var(--accent)" id="statTotal">0</div>
    <div class="stat-label">Total Tickets</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-num" style="color:var(--text3)" id="statTodo">0</div>
    <div class="stat-label">To Do</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-num" style="color:var(--inprog)" id="statInProg">0</div>
    <div class="stat-label">In Progress</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-num" style="color:var(--done)" id="statDone">0</div>
    <div class="stat-label">Done</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-num" style="color:var(--accent4)" id="statPhases">11</div>
    <div class="stat-label">Total Phases</div>
  </div>
</div>

<!-- PHASE TABS -->
<div class="phase-nav" id="phaseTabs"></div>

<!-- BOARD AREA -->
<div class="board-area">
  <div class="phase-header">
    <div class="phase-title" id="phaseTitle"></div>
    <div class="phase-desc" id="phaseDesc"></div>
    <div class="phase-tags" id="phaseTags"></div>
  </div>
  <div id="lockedOverlay" class="locked-overlay">
    <div class="locked-icon">🔒</div>
    <div class="locked-title">Phase Locked</div>
    <div class="locked-desc">Complete Phase 1 to unlock this phase.</div>
  </div>
  <div id="sprintBarContainer"></div>
  <div class="kanban" id="kanbanBoard"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-id" id="modalId"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-section">
      <div class="modal-section-title">Description</div>
      <div class="modal-desc" id="modalDesc"></div>
    </div>
    <div class="modal-section" id="modalConceptsWrap">
      <div class="modal-section-title">Java Concepts You'll Learn</div>
      <ul class="concept-list" id="modalConcepts"></ul>
    </div>
    <div class="modal-section" id="modalCodeWrap">
      <div class="modal-section-title">Code Hint / Structure</div>
      <div class="code-hint" id="modalCode"></div>
    </div>
    <div class="modal-status-row">
      <button class="modal-status-btn todo" onclick="setStatus(currentTicketId, 'todo')">📋 To Do</button>
      <button class="modal-status-btn inprog" onclick="setStatus(currentTicketId, 'inprog')">⚡ In Progress</button>
      <button class="modal-status-btn review" onclick="setStatus(currentTicketId, 'review')">👁 In Review</button>
      <button class="modal-status-btn done" onclick="setStatus(currentTicketId, 'done')">✅ Done</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────
const phases = [
  {
    id:1, label:"Phase 1", title:"Core Java & OOP",
    desc:"Build the E-Commerce domain in pure Java — no frameworks. Every class you write here becomes the foundation for your Spring Boot app.",
    tags:["OOP","Collections","Streams","Design Patterns","Generics","Exceptions"],
    locked: false,
    tickets: [
      {
        id:"EC-001", title:"Set up project structure & understand Java project anatomy",
        priority:"high", est:"1h",
        tags:[{label:"java",cls:"java"}],
        desc:"Create a plain Maven/Gradle Java project. Understand package structure, main method, and how Java compiles. This is your workspace for all Phase 1 tasks.",
        concepts:[
          "Java project structure: src/main/java, packages, classpath",
          "Maven basics: pom.xml, dependencies, build lifecycle",
          "main() method — entry point of every Java program",
          "How javac compiles .java → .class bytecode",
          "JDK vs JRE vs JVM — what's the difference"
        ],
        code:`// Project structure:
ecommerce/
├── src/main/java/
│   └── com/shoplearn/
│       ├── model/         ← domain classes
│       ├── service/       ← business logic
│       ├── exception/     ← custom exceptions
│       └── Main.java      ← entry point
└── pom.xml`
      },
      {
        id:"EC-002", title:"Model Product class with OOP principles",
        priority:"high", est:"2h",
        tags:[{label:"java",cls:"java"},{label:"OOP",cls:"design"}],
        desc:"Create the Product class using proper OOP: encapsulation with private fields, getters/setters, constructors, and toString. This is the most important entity in our e-commerce system.",
        concepts:[
          "Encapsulation — private fields, public getters/setters",
          "Constructors — default, parameterized, copy constructor",
          "this keyword — referring to current object",
          "toString(), equals(), hashCode() — Object methods",
          "@Override annotation",
          "Immutability — why final fields matter for ProductId"
        ],
        code:`public class Product {
    private final String id;      // immutable ID
    private String name;
    private double price;
    private int stockQuantity;
    private String category;

    // Constructors, getters, setters
    // toString, equals, hashCode
}`
      },
      {
        id:"EC-003", title:"Build class hierarchy with Inheritance & Interfaces",
        priority:"high", est:"3h",
        tags:[{label:"java",cls:"java"},{label:"OOP",cls:"design"}],
        desc:"Model different product types (ElectronicsProduct, ClothingProduct) and shared behaviors using interfaces (Discountable, Shippable). Understand when to use abstract class vs interface.",
        concepts:[
          "Inheritance — extends keyword, parent/child classes",
          "Abstract classes — can't instantiate, may have abstract methods",
          "Interfaces — contract, all methods public abstract by default",
          "When to use interface vs abstract class (IS-A vs CAN-DO)",
          "Method overriding vs overloading",
          "super keyword — calling parent constructor/methods",
          "Polymorphism — same method, different behavior"
        ],
        code:`interface Discountable {
    double applyDiscount(double percent);
}
interface Shippable {
    double calculateShipping();
}
abstract class BaseProduct implements Discountable { ... }
class ElectronicsProduct extends BaseProduct implements Shippable { ... }
class ClothingProduct extends BaseProduct { ... }`
      },
      {
        id:"EC-004", title:"Model User, Cart and Order with relationships",
        priority:"high", est:"2h",
        tags:[{label:"java",cls:"java"},{label:"OOP",cls:"design"}],
        desc:"Create User, Cart, CartItem and Order classes. Practice composition (HAS-A) relationships and understand how objects reference each other in memory.",
        concepts:[
          "Composition vs Inheritance — HAS-A vs IS-A",
          "Object references — how Java stores objects in memory",
          "Enums — OrderStatus (PENDING, CONFIRMED, SHIPPED, DELIVERED)",

// ─── STATE ──────────────────────────────────────────────────────
let currentPhase = 1;
let currentTicketId = null;

// Load persisted statuses or default all to 'todo'
let ticketStatus = {};
try {
  const saved = localStorage.getItem('shoplearn_ticketStatus');
  ticketStatus = saved ? JSON.parse(saved) : {};
} catch(e) { ticketStatus = {}; }

// Ensure any tickets not yet saved default to 'todo'
phases.forEach(p => p.tickets.forEach(t => {
  if (!ticketStatus[t.id]) ticketStatus[t.id] = 'todo';
}));

function saveStatus() {
  try { localStorage.setItem('shoplearn_ticketStatus', JSON.stringify(ticketStatus)); } catch(e) {}
}

// ─── SPRINT STATE ────────────────────────────────────────────────
let sprintData = {};
try {
  const saved = localStorage.getItem('shoplearn_sprintData');
  sprintData = saved ? JSON.parse(saved) : {};
} catch(e) { sprintData = {}; }

function saveSprint() {
  try { localStorage.setItem('shoplearn_sprintData', JSON.stringify(sprintData)); } catch(e) {}
}
function getSprintForPhase(phaseId) {
  return sprintData[phaseId] || { status: 'not_started', startDate: null, endDate: null };
}
function startSprint(phaseId) {
  const dateStr = document.getElementById('sprintStartDate').value;
  if (!dateStr) { alert('Please select a start date.'); return; }
  sprintData[phaseId] = { status: 'active', startDate: dateStr, endDate: null };
  saveSprint(); renderBoard();
}
function completeSprint(phaseId) {
  const dateStr = document.getElementById('sprintEndDate').value;
  if (!dateStr) { alert('Please select a completion date.'); return; }
  const sprint = getSprintForPhase(phaseId);
  sprintData[phaseId] = { ...sprint, status: 'completed', endDate: dateStr };
  saveSprint(); renderBoard();
}
function reopenSprint(phaseId) {
  const sprint = getSprintForPhase(phaseId);
  sprintData[phaseId] = { ...sprint, status: 'active', endDate: null };
  saveSprint(); renderBoard();
}

// ─── RENDER ─────────────────────────────────────────────────────
function renderTabs() {
  const nav = document.getElementById('phaseTabs');
  nav.innerHTML = phases.map(p => {
    const sprint = getSprintForPhase(p.id);
    const dot = sprint.status === 'completed' ? 'var(--done)' : sprint.status === 'active' ? 'var(--inprog)' : 'var(--text3)';
    return `<div class="phase-tab ${p.id===currentPhase?'active':''}" onclick="switchPhase(${p.id})">
      <span class="tab-dot" style="background:${dot}"></span>${p.label}
    </div>`;
  }).join('');
}

function renderSprintBar(phase) {
  const sprint = getSprintForPhase(phase.id);
  const today = new Date().toISOString().split('T')[0];

  if (sprint.status === 'not_started') {
    return `<div class="sprint-bar">
      <div class="sprint-bar-left">
        <span class="sprint-status-badge not-started">⬜ Not Started</span>
      </div>
      <div class="sprint-bar-right">
        <label class="sprint-label">Start Date</label>
        <input type="date" id="sprintStartDate" class="sprint-date-input" value="${today}">
        <button class="sprint-btn start-btn" onclick="startSprint(${phase.id})">▶ Start Sprint</button>
      </div>
    </div>`;
  }

  if (sprint.status === 'active') {
    return `<div class="sprint-bar">
      <div class="sprint-bar-left">
        <span class="sprint-status-badge active">🟡 In Progress</span>
        <span class="sprint-date-display">Started: <strong>${formatDate(sprint.startDate)}</strong></span>
      </div>
      <div class="sprint-bar-right">
        <label class="sprint-label">Complete Date</label>
        <input type="date" id="sprintEndDate" class="sprint-date-input" value="${today}">
        <button class="sprint-btn complete-btn" onclick="completeSprint(${phase.id})">✅ Complete Sprint</button>
      </div>
    </div>`;
  }

  if (sprint.status === 'completed') {
    return `<div class="sprint-bar">
      <div class="sprint-bar-left">
        <span class="sprint-status-badge completed">✅ Completed</span>
        <span class="sprint-date-display">Started: <strong>${formatDate(sprint.startDate)}</strong> &nbsp;·&nbsp; Completed: <strong>${formatDate(sprint.endDate)}</strong></span>
      </div>
      <div class="sprint-bar-right">
        <button class="sprint-btn reopen-btn" onclick="reopenSprint(${phase.id})">↩ Reopen Sprint</button>
      </div>
    </div>`;
  }
  return '';
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function renderBoard() {
  const phase = phases.find(p => p.id === currentPhase);
  document.getElementById('phaseTitle').innerHTML = `<span>Phase ${phase.id}</span> — ${phase.title}`;
  document.getElementById('phaseDesc').textContent = phase.desc;
  document.getElementById('phaseTags').innerHTML = phase.tags.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('lockedOverlay').classList.remove('show');

  // Inject sprint bar
  const sprintBarEl = document.getElementById('sprintBarContainer');
  sprintBarEl.innerHTML = renderSprintBar(phase);

  const board = document.getElementById('kanbanBoard');
  board.style.display = 'grid';

  const cols = [
    {key:'todo', label:'TO DO', color:'var(--todo)'},
    {key:'inprog', label:'IN PROGRESS', color:'var(--inprog)'},
    {key:'review', label:'IN REVIEW', color:'var(--review)'},
    {key:'done', label:'DONE', color:'var(--done)'},
  ];

  board.innerHTML = cols.map(col => {
    const tickets = phase.tickets.filter(t => (ticketStatus[t.id]||'todo') === col.key);
    return `
    <div class="column" ondragover="event.preventDefault()" ondrop="drop(event,'${col.key}')">
      <div class="col-header">
        <div class="col-title-wrap">
          <div class="col-dot" style="background:${col.color}"></div>
          <div class="col-title" style="color:${col.color}">${col.label}</div>
        </div>
        <div class="col-count">${tickets.length}</div>
      </div>
      ${tickets.map(t => renderTicket(t)).join('')}
    </div>`;
  }).join('');

  updateStats();
}

function renderTicket(t) {
  const status = ticketStatus[t.id]||'todo';
  const priorityClass = t.priority==='high'?'priority-high':t.priority==='med'?'priority-med':'priority-low';
  const priorityLabel = t.priority==='high'?'High':t.priority==='med'?'Medium':'Low';
  return `
  <div class="ticket phase${currentPhase}" draggable="true"
       ondragstart="drag(event,'${t.id}')"
       onclick="openModal('${t.id}')">
    <div class="ticket-id">${t.id}</div>
    <div class="ticket-title">${t.title}</div>
    <div class="ticket-tags">${t.tags.map(tag=>`<span class="ticket-tag ${tag.cls}">${tag.label}</span>`).join('')}</div>
    <div class="ticket-footer">
      <div class="ticket-priority ${priorityClass}">
        <div class="priority-dot"></div>
        <span class="priority-text">${priorityLabel}</span>
      </div>
      <div class="ticket-est">⏱ ${t.est}</div>
    </div>
  </div>`;
}

function updateStats() {
  const phase = phases.find(p=>p.id===currentPhase);
  const all = phase.tickets;
  const total = all.length;
  const done = all.filter(t=>(ticketStatus[t.id]||'todo')==='done').length;
  const inprog = all.filter(t=>(ticketStatus[t.id]||'todo')==='inprog').length;
  const review = all.filter(t=>(ticketStatus[t.id]||'todo')==='review').length;
  const todo = all.filter(t=>(ticketStatus[t.id]||'todo')==='todo').length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statTodo').textContent = todo;
  document.getElementById('statInProg').textContent = inprog + review;
  document.getElementById('statDone').textContent = done;

  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '%';
}

// ─── MODAL ──────────────────────────────────────────────────────
function openModal(ticketId) {
  const phase = phases.find(p=>p.id===currentPhase);
  const t = phase.tickets.find(t=>t.id===ticketId);
  currentTicketId = ticketId;

  document.getElementById('modalId').textContent = t.id + ' · Phase ' + currentPhase;
  document.getElementById('modalTitle').textContent = t.title;
  document.getElementById('modalDesc').textContent = t.desc;
  document.getElementById('modalConcepts').innerHTML = t.concepts.map(c=>`<li>${c}</li>`).join('');
  if(t.code) {
    document.getElementById('modalCodeWrap').style.display = 'block';
    document.getElementById('modalCode').textContent = t.code;
  } else {
    document.getElementById('modalCodeWrap').style.display = 'none';
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

// ─── STATUS ─────────────────────────────────────────────────────
function setStatus(id, status) {
  ticketStatus[id] = status;
  saveStatus();
  closeModal();
  renderBoard();
}

// ─── DRAG & DROP ────────────────────────────────────────────────
let draggedId = null;
function drag(e, id) { draggedId = id; }
function drop(e, colKey) {
  if(draggedId) { ticketStatus[draggedId] = colKey; saveStatus(); renderBoard(); draggedId = null; }
}

// ─── SWITCH PHASE ───────────────────────────────────────────────
function switchPhase(id) {
  currentPhase = id;
  renderTabs();
  renderBoard();
}

// ─── INIT ───────────────────────────────────────────────────────
renderTabs();
renderBoard();
</script>
</body>
